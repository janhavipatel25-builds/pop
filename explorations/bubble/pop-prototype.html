<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pop prototype: bubble interaction</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b3345; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  #hud {
    position: fixed; left: 16px; top: 14px; color: rgba(255,255,255,.85);
    font: 13px/1.5 -apple-system, system-ui, sans-serif; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>

<script>
/* ============================================================
   TWEAK ME. Change a number, save, refresh the browser.
   ============================================================ */
const CFG = {
  // --- how many, how big, how they arrive ---
  maxBubbles: 8,         // bubbles on screen at once. New ones pour in as you pop.
  spawnEvery: 1.4,       // seconds between new bubbles while pouring
  minRadius: 48,         // smallest bubble (px)
  maxRadius: 100,        // biggest bubble (px)
  pourSpeed: [260, 460], // launch speed range (px/s)
  pourAngle: [-55, -15], // launch direction in degrees (-90 = straight up)
  drag: 0.6,             // how quickly they slow down (higher = stops sooner)
  gap: 10,               // minimum space kept between bubbles (px)

  // --- shape ---
  stretch: 0.55,         // how elongated a bubble gets while flying in
  restStretch: [0, 0.02],// leftover "not a circle" once settled (0 = perfect sphere)
  tail: 0.6,             // length of the entering tail (0 = none)
  tailFade: 2.0,         // seconds for the tail to retract
  wobble: 0.05,          // how wobbly the outline is while moving
  wobbleRest: 0.012,     // how wobbly once settled (tiny breathing)

  // --- the skin (soap film) that fades in as a bubble settles ---
  skinAlpha: 0.10,       // faint glassy tint behind the characters (they are the real skin)
  skinSettle: 70,        // speed (px/s) below which the skin starts to appear
  skinFade: 1.2,         // how fast the skin fades in

  // --- the character-grid surface (ASCII / dot-matrix look) ---
  ramp: " .,:;-=+xX#%@", // light to heavy. Try " ·:+x#@" or "01" or " .oO0@".
  cellW: 4.3, cellH: 7.5,// grid spacing (px). Smaller = finer, denser.
  fontSize: 7,           // character size (px)
  fontWeight: "bold",    // "bold" = heavier, more intense marks. "normal" = lighter.
  intensity: 0.85,       // overall opacity of the marks (0 to 1). Lower = more see-through.
  saturation: 70,        // colour strength of the marks (0 = grey, 100 = vivid)
  rimWeight: 1.0,        // how strong the edge ring is
  rimPower: 6,           // how tight the ring is (higher = thinner ring, more see-through centre)
  insideWeight: 0.3,     // how strong the swirling film inside is (0 = hollow)
  filmBands: 1.6,        // how many colour bands swirl across the film
  filmScale: 1.8,        // size of the swirls (higher = smaller swirls)
  waveSpeed: 1.0,        // how fast the film flows
  dither: 0.14,          // grain that blends the shading (0 = hard steps)
  contrast: 1.45,        // higher = fewer, bolder characters
  spin: 0.22,            // how fast the characters rotate around the bubble (rad/s)
  backWeight: 0.6,       // how visible the far side is through the bubble (0 = hidden)
  colorSpeed: 35,        // how fast the rainbow rotates
  colorSpread: 0.35,     // how much the rainbow varies across a bubble (0 = one colour)
  rimWidth: 1.0,         // thickness of the hairline edge once settled (0 = characters only)
};

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const hud = document.getElementById('hud');
let W, H, DPR = 1;
let atlas = [];                       // pre-drawn characters
const RIM_X = new Float32Array(65), RIM_Y = new Float32Array(65);
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  atlas.length = 0;
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const RAMP = Array.from(CFG.ramp);
const bubbles = [], bits = [];
let pouring = true, spawnTimer = 0, popped = 0, bgMode = 0, time = 0;

/* Backgrounds: each has a name, a glyph lightness (dark glyphs on light
   backgrounds, light glyphs on dark ones) and a paint function. All drawn
   in code, no images. Painted once into a cache, redrawn on resize. */
const grad = (c, W, H, stops, x0 = 0, y0 = 0, x1 = 0, y1 = H) => {
  const g = c.createLinearGradient(x0, y0, x1, y1);
  stops.forEach(([t, col]) => g.addColorStop(t, col));
  c.fillStyle = g; c.fillRect(0, 0, W, H);
};
let seed = 1;
const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const lines = (c, x, y, w, rows, gap, col, h = 6) => {   // fake lines of text
  c.fillStyle = col;
  for (let i = 0; i < rows; i++) c.fillRect(x, y + i * gap, w * (0.45 + srand() * 0.55), h);
};
const BACKGROUNDS = [
  { name: 'dusk', glyph: 62, paint(c, W, H) { grad(c, W, H, [[0, '#9fb4c8'], [1, '#e8d3c0']]); } },
  { name: 'dark app', glyph: 76, paint(c, W, H) { grad(c, W, H, [[0, '#2b3345'], [1, '#1b2030']]); } },
  { name: 'light document', glyph: 46, paint(c, W, H) {
      grad(c, W, H, [[0, '#f4f1ec'], [1, '#e6e2da']]);
      seed = 7; c.fillStyle = '#fff'; c.fillRect(W * 0.2, 0, W * 0.6, H);
      for (let i = 0; i < 6; i++) lines(c, W * 0.26, 90 + i * (H / 6.5), W * 0.48, 4, 22, '#d8d4cc', 8);
    } },
  { name: 'code editor', glyph: 78, paint(c, W, H) {
      c.fillStyle = '#1e1e24'; c.fillRect(0, 0, W, H);
      c.fillStyle = '#17171c'; c.fillRect(0, 0, 220, H);
      seed = 11; const cols = ['#6aa0e0', '#c586c0', '#d7ba7d', '#7fbf8e', '#9a9aa8'];
      for (let y = 40, i = 0; y < H - 20; y += 22, i++) {
        let x = 250 + (srand() < 0.5 ? 0 : 32);
        for (let k = 0; k < 2 + srand() * 4; k++) {
          const w = 30 + srand() * 110;
          c.fillStyle = cols[Math.floor(srand() * cols.length)]; c.globalAlpha = 0.55;
          c.fillRect(x, y, w, 8); x += w + 12;
        }
        c.globalAlpha = 1;
      }
    } },
  { name: 'busy photo', glyph: 70, paint(c, W, H) {
      grad(c, W, H, [[0, '#f2a65a'], [0.5, '#d6537a'], [1, '#3b5ba5']], 0, 0, W, H);
      seed = 3;
      for (let i = 0; i < 70; i++) {                       // lots of colour blobs + detail
        const x = srand() * W, y = srand() * H, r = 20 + srand() * 140;
        const g = c.createRadialGradient(x, y, 0, x, y, r);
        const col = `hsl(${Math.floor(srand() * 360)},75%,${35 + srand() * 40}%)`;
        g.addColorStop(0, col); g.addColorStop(1, 'transparent');
        c.globalAlpha = 0.7; c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
      }
      c.globalAlpha = 0.18;
      for (let i = 0; i < 900; i++) {                      // fine grain, like texture
        c.fillStyle = srand() < 0.5 ? '#000' : '#fff';
        c.fillRect(srand() * W, srand() * H, 2 + srand() * 4, 2 + srand() * 4);
      }
      c.globalAlpha = 1;
    } },
  { name: 'vivid blue', glyph: 78, paint(c, W, H) { grad(c, W, H, [[0, '#1d4ed8'], [1, '#0b1f6b']]); } },
  { name: 'bright yellow', glyph: 38, paint(c, W, H) { grad(c, W, H, [[0, '#ffe066'], [1, '#ffc233']]); } },
  { name: 'pure black', glyph: 80, paint(c, W, H) { c.fillStyle = '#000'; c.fillRect(0, 0, W, H); } },
  { name: 'pure white', glyph: 42, paint(c, W, H) { c.fillStyle = '#fff'; c.fillRect(0, 0, W, H); } },
];
let bgCache = null;
function bgImage() {                                       // painted once per mode and size
  if (!bgCache || bgCache.mode !== bgMode || bgCache.W !== W || bgCache.H !== H) {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    BACKGROUNDS[bgMode].paint(c.getContext('2d'), W, H);
    bgCache = { c, mode: bgMode, W, H };
  }
  return bgCache.c;
}

function spawn() {
  const r = rand(CFG.minRadius, CFG.maxRadius);
  const ang = rand(...CFG.pourAngle) * Math.PI / 180;
  const sp = rand(...CFG.pourSpeed);
  const b = {
    x: -r * 2.5, y: H + r * 2.5,       // starts off-screen, bottom-left
    vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
    r, ph: rand(0, TAU), age: 0, hue: rand(0, 360), flash: 0, skin: 0,
    rest: rand(...CFG.restStretch), restAng: rand(0, Math.PI),
    angle: ang, cells: [], path: null,
    tilt: rand(-0.5, 0.5), spinDir: Math.random() < 0.5 ? -1 : 1,
  };
  makeSurface(b);
  bubbles.push(b);
}

/* Shape: a point at angle `a` on the outline, scaled by `f` (1 = edge).
   Stretched along the direction of travel, wobbly, with a tail behind. */
function prepShape(b) {
  const speed = Math.hypot(b.vx, b.vy);
  const k = {};
  k.s = 1 + b.rest + CFG.stretch * Math.min(speed / 450, 1);
  k.tail = Math.max(0, 1 - b.age / CFG.tailFade) * CFG.tail;
  k.wob = CFG.wobbleRest + (CFG.wobble - CFG.wobbleRest) * Math.min(speed / 300, 1);
  k.ch = Math.cos(b.angle); k.sh = Math.sin(b.angle);
  b.k = k;
}
function pointAt(b, a, f) {
  const k = b.k, ca = Math.cos(a), sa = Math.sin(a);
  const wob = 1 + k.wob * (0.6 * Math.sin(3 * a + time * 1.3 + b.ph) + 0.4 * Math.sin(5 * a - time * 1.9 + b.ph * 2));
  let lx = ca * b.r * k.s * wob, ly = sa * b.r / Math.sqrt(k.s) * wob;
  const d = Math.atan2(Math.sin(a - Math.PI), Math.cos(a - Math.PI));
  const g = Math.exp(-d * d / 0.09);          // bump at the back
  lx -= g * b.r * 2.4 * k.tail;
  ly *= 1 - 0.55 * g * k.tail;
  lx *= f; ly *= f;
  return { x: b.x + lx * k.ch - ly * k.sh, y: b.y + lx * k.sh + ly * k.ch };
}
function outlinePath(b) {
  const N = 56, pts = [];
  for (let i = 0; i < N; i++) pts.push(pointAt(b, (i / N) * TAU, 1));
  const p = new Path2D();
  p.moveTo((pts[N - 1].x + pts[0].x) / 2, (pts[N - 1].y + pts[0].y) / 2);
  for (let i = 0; i < N; i++) {
    const n = pts[(i + 1) % N];
    p.quadraticCurveTo(pts[i].x, pts[i].y, (pts[i].x + n.x) / 2, (pts[i].y + n.y) / 2);
  }
  p.closePath();
  return p;
}

function update(dt) {
  time += dt;
  if (pouring && bubbles.length < CFG.maxBubbles) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawn(); spawnTimer = CFG.spawnEvery; }
  }
  for (const b of bubbles) {
    b.age += dt; b.flash = Math.max(0, b.flash - dt * 1.5);
    const k = Math.exp(-CFG.drag * dt);
    b.vx *= k; b.vy *= k;
    b.vy -= 5 * dt;                                // a tiny upward float
    b.vx += Math.sin(time * 0.6 + b.ph) * 5 * dt;  // lazy side drift
    b.x += b.vx * dt; b.y += b.vy * dt;
    // turn toward travel direction while moving, relax to its own tilt when settled
    const sp = Math.hypot(b.vx, b.vy);
    // skin fades in once the bubble has come in and slowed down
    const settled = b.age > 1 && sp < CFG.skinSettle;
    b.skin = Math.max(0, Math.min(1, b.skin + (settled ? dt : -dt * 2) * CFG.skinFade));
    const target = sp > 40 ? Math.atan2(b.vy, b.vx) : b.restAng;
    let diff = Math.atan2(Math.sin(target - b.angle), Math.cos(target - b.angle));
    if (sp <= 40 && Math.abs(diff) > Math.PI / 2) diff = diff > 0 ? diff - Math.PI : diff + Math.PI; // an oval has two equal ends
    b.angle += diff * Math.min(1, dt * (sp > 40 ? 8 : 1.2));
    // soft walls once a bubble has come in
    if (b.age > 1.2) {
      const m = b.r * 1.1;
      if (b.x < m) b.vx += 140 * dt;
      if (b.x > W - m) b.vx -= 140 * dt;
      if (b.y < m) b.vy += 140 * dt;
      if (b.y > H - m) b.vy -= 140 * dt;
    }
  }
  // bubbles never overlap: push apart and bounce gently
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < bubbles.length; i++) for (let j = i + 1; j < bubbles.length; j++) {
      const a = bubbles[i], c = bubbles[j];
      const ra = a.r * (1 + 0.5 * (a.k ? a.k.s - 1 : 0)), rc = c.r * (1 + 0.5 * (c.k ? c.k.s - 1 : 0));
      let dx = c.x - a.x, dy = c.y - a.y, d = Math.hypot(dx, dy) || 0.001;
      const min = ra + rc + CFG.gap;
      if (d < min) {
        const nx = dx / d, ny = dy / d, push = (min - d) / 2;
        a.x -= nx * push; a.y -= ny * push; c.x += nx * push; c.y += ny * push;
        const rv = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
        if (rv < 0) {
          const j2 = -rv * 0.6;
          a.vx -= nx * j2; a.vy -= ny * j2; c.vx += nx * j2; c.vy += ny * j2;
          if (rv < -25) { a.flash = c.flash = 1; }   // a bump makes the colours flare
        }
      }
    }
  }
  for (let i = bits.length - 1; i >= 0; i--) {
    const q = bits[i]; q.life -= dt;
    q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.95; q.vy *= 0.95;
    if (q.life <= 0) bits.splice(i, 1);
  }
}

// tiny smooth noise, used for the swirling film
const hash = (x, y) => { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const s = t => t * t * (3 - 2 * t), u = s(xf), v = s(yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const glyphLight = () => BACKGROUNDS[bgMode].glyph;

function drawBubble(b) {
  prepShape(b);
  const path = b.path = outlinePath(b);
  const R = b.r * 1.6, h0 = b.hue + time * CFG.colorSpeed;
  // faint body + hairline edge so the bubble reads as one object
  const g = ctx.createLinearGradient(b.x - R, b.y - R, b.x + R, b.y + R);
  for (let i = 0; i <= 5; i++) g.addColorStop(i / 5, `hsla(${(h0 + i * 60) % 360}, 90%, 72%, 0.9)`);
  // the skin: a soap film. Tinted toward the edge, iridescent rim, window highlights.
  const sk = b.skin;
  if (sk > 0.01) {
    const Rs = b.r * b.k.s * 1.05;
    const film = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, Rs);
    film.addColorStop(0, 'hsla(0,0%,100%,0)');
    film.addColorStop(0.65, `hsla(${h0 % 360},80%,80%,${CFG.skinAlpha * 0.15})`);
    film.addColorStop(1, `hsla(${(h0 + 120) % 360},90%,75%,${CFG.skinAlpha})`);
    ctx.save();
    ctx.globalAlpha = sk; ctx.fillStyle = film; ctx.fill(path);
    ctx.strokeStyle = g; ctx.lineWidth = CFG.rimWidth; ctx.globalAlpha = 0.65 * sk; ctx.stroke(path);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 0.7; ctx.globalAlpha = 0.5 * sk; ctx.stroke(path);
    // highlights: a bigger one upper-left, a small echo lower-right
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.55 * sk;
    ctx.beginPath(); ctx.ellipse(b.x - b.r * 0.42, b.y - b.r * 0.46, b.r * 0.2, b.r * 0.08, -0.7, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.25 * sk;
    ctx.beginPath(); ctx.ellipse(b.x + b.r * 0.45, b.y + b.r * 0.5, b.r * 0.1, b.r * 0.04, -0.7, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // The character surface. Characters live on a SPHERE (rows of latitude, evenly
  // spaced along the surface, laid out once in makeSurface). Each frame the sphere
  // spins, and every character is projected onto the bubble's real outline, so they
  // curve around it, squash toward the edge, and wrap over the rim.
  const k = b.k, nR = RAMP.length - 1, sf = b.sf, N = b.nCells;
  b.cells.length = 0;
  // the outline as 64 points (stretch, wobble and tail included), so each character can find its place quickly
  const tx = RIM_X, ty = RIM_Y;
  for (let i = 0; i <= 64; i++) {
    const a = (i / 64) * TAU, ca = Math.cos(a), sa = Math.sin(a);
    const wob = 1 + k.wob * (0.6 * Math.sin(3 * a + time * 1.3 + b.ph) + 0.4 * Math.sin(5 * a - time * 1.9 + b.ph * 2));
    const d = Math.atan2(Math.sin(a - Math.PI), Math.cos(a - Math.PI)), g = Math.exp(-d * d / 0.09);
    tx[i] = ca * b.r * k.s * wob - g * b.r * 2.4 * k.tail;
    ty[i] = sa * b.r / Math.sqrt(k.s) * wob * (1 - 0.55 * g * k.tail);
  }
  const spin = time * CFG.spin * b.spinDir + b.ph, cS = Math.cos(spin), sS = Math.sin(spin);
  const sT = Math.sin(b.tilt), cT = Math.cos(b.tilt), tt = time * CFG.waveSpeed;
  const hBase = b.hue * 0.35 + time * CFG.colorSpeed * 0.35, hs = 230 * CFG.colorSpread;
  const rimW = CFG.rimWeight, inW = CFG.insideWeight, cont = CFG.contrast, dith = CFG.dither;
  const rimP = CFG.rimPower, bands = CFG.filmBands * TAU, bw = CFG.backWeight, inten = CFG.intensity;
  for (let q = 0; q < N; q++) {
    const o = q * 7;
    const sl = sf[o], cl = sf[o + 1], cphi = sf[o + 2], oy = sf[o + 3];
    // turn the sphere, tilt it, and see where this character lands as the viewer sees it
    const vx = cphi * (sl * cS + cl * sS), vz0 = cphi * (cl * cS - sl * sS);
    const vy = oy * cT - vz0 * sT, vz = oy * sT + vz0 * cT;
    const back = vz < 0;                                  // far side, seen through the bubble
    const f = Math.sqrt(vx * vx + vy * vy);               // 0 = centre of the disc, 1 = rim
    const z = Math.max(0.28, Math.abs(vz));
    if (back && (f < 0.55 || sf[o + 6])) continue;
    if (z < 0.3 && sf[o + 6]) continue;                   // very squashed at the rim: keep every other one
    const fres = Math.pow(f, rimP);                       // the rim is seen edge-on, so it is brightest
    const grav = 0.5 + 0.4 * vy;                          // film is thicker toward the bottom
    const thick = sf[o + 4] + 0.35 * grav;
    const band = 0.5 + 0.5 * Math.sin(thick * bands + tt * 0.5);
    let br = rimW * fres + inW * band * (1 - 0.5 * fres);
    if (back) br *= bw;
    else {  // highlights, also built from characters
      const h1 = Math.hypot(vx + 0.42, vy + 0.46) / 0.3, h2 = Math.hypot(vx - 0.45, vy - 0.5) / 0.16;
      if (h1 < 1) br += 0.7 * Math.pow(1 - h1, 1.5);
      if (h2 < 1) br += 0.3 * Math.pow(1 - h2, 1.5);
    }
    br = Math.min(1, Math.pow(Math.max(0, br * cont), 1.1) + b.flash * 0.3 * band);
    br += (sf[o + 5] - 0.5) * dith;                       // grain so shading blends smoothly
    const idx = Math.round(Math.max(0, Math.min(1, br)) * nR);
    if (idx <= 0) continue;
    // place it on the outline
    const u = vx * k.ch + vy * k.sh, v = -vx * k.sh + vy * k.ch;
    let a = Math.atan2(v, u); if (a < 0) a += TAU;
    const t = a / TAU * 64, i0 = Math.floor(t), w = t - i0;
    const lx = f * (tx[i0] + (tx[i0 + 1] - tx[i0]) * w), ly = f * (ty[i0] + (ty[i0 + 1] - ty[i0]) * w);
    const px = b.x + lx * k.ch - ly * k.sh, py = b.y + lx * k.sh + ly * k.ch;
    // thin-film colour follows thickness
    const hb = Math.floor((((hBase + (thick * 1.3 + grav * 0.4) * hs + fres * 50 + b.flash * 140) % 360) + 360) % 360 / 15);
    const s = sprite(idx, hb);
    let sx = 1, sy = 1;
    if (f > 0.5) {    // near the rim the surface turns away: squash the character along that direction
      const dx = px - b.x, dy = py - b.y, c2 = dx * dx / (dx * dx + dy * dy + 1e-6);
      sx = 1 - (1 - z) * c2; sy = 1 - (1 - z) * (1 - c2);
    }
    ctx.globalAlpha = inten * (0.7 + 0.3 * Math.min(1, br)) * (back ? 0.55 : 1);
    ctx.drawImage(s.c, px - s.w * sx / 2, py - s.h * sy / 2, s.w * sx, s.h * sy);
    b.cells.push({ x: px, y: py, idx, hb });
  }
  ctx.globalAlpha = 1;
}

// Lay the characters out on a sphere once. Their film thickness is fixed to the surface.
function makeSurface(b) {
  const rows = Math.max(6, Math.round(Math.PI * b.r / CFG.cellH)), fs = CFG.filmScale, list = [];
  for (let j = 0; j < rows; j++) {
    const phi = -Math.PI / 2 + (j + 0.5) / rows * Math.PI;
    const cphi = Math.cos(phi), oy = Math.sin(phi);
    const nLon = Math.max(1, Math.round(TAU * b.r * cphi / CFG.cellW));
    for (let m = 0; m < nLon; m++) {
      const lon0 = (m + (j & 1) * 0.5) / nLon * TAU;
      const ox = cphi * Math.sin(lon0), oz = cphi * Math.cos(lon0);
      const thick = 0.6 * vnoise(ox * fs * 1.5 + oz * fs * 1.1 + b.ph, oy * fs * 1.5)
                  + 0.3 * vnoise(ox * fs * 3.2 - oz * fs * 2.4 - b.ph, oy * fs * 3.2);
      list.push(Math.sin(lon0), Math.cos(lon0), cphi, oy, thick, hash(j * 3.7, m * 1.3), (j + m) & 1);
    }
  }
  b.sf = Float32Array.from(list); b.nCells = list.length / 7;
}

// Each character in each colour is drawn once into a tiny image, then stamped many times.
function sprite(idx, hb) {
  const key = idx * 24 + hb;
  let s = atlas[key];
  if (!s) {
    const w = Math.ceil(CFG.fontSize * DPR * 0.9) + 2, h = Math.ceil(CFG.fontSize * DPR * 1.2) + 2;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    x.font = `${CFG.fontWeight} ${CFG.fontSize * DPR}px "SF Mono", Menlo, monospace`;
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillStyle = `hsl(${hb * 15 + 7}, ${CFG.saturation}%, ${glyphLight() + 8 * idx / (RAMP.length - 1) - 6}%)`;
    x.fillText(RAMP[idx], w / 2, h / 2);
    s = atlas[key] = { c, w: w / DPR, h: h / DPR };
  }
  return s;
}

function draw() {
  ctx.drawImage(bgImage(), 0, 0, W, H);
  for (const b of bubbles) drawBubble(b);
  for (const q of bits) {
    const s = sprite(q.idx, q.hb);
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.drawImage(s.c, q.x - s.w / 2, q.y - s.h / 2, s.w, s.h);
  }
  ctx.globalAlpha = 1;
  hud.innerHTML = `Popped: <b>${popped}</b> &nbsp;·&nbsp; click a bubble to pop &nbsp;·&nbsp; <b>Space</b> pour ${pouring ? 'on' : 'off'} &nbsp;·&nbsp; <b>B</b> background: ${BACKGROUNDS[bgMode].name} (${bgMode + 1}/${BACKGROUNDS.length}) &nbsp;·&nbsp; <b>R</b> clear`;
}

/* Popping: the characters that made the surface scatter outward. */
function pop(b) {
  bubbles.splice(bubbles.indexOf(b), 1); popped++;
  for (const c of b.cells) {
    const dx = c.x - b.x, dy = c.y - b.y, d = Math.hypot(dx, dy) || 1;
    const sp = rand(120, 360);
    bits.push({ x: c.x, y: c.y, vx: dx / d * sp + b.vx * 0.3, vy: dy / d * sp + b.vy * 0.3,
                idx: c.idx, hb: c.hb, life: rand(0.5, 0.9), max: 0.9 });
  }
}

cv.addEventListener('pointerdown', e => {
  for (let i = bubbles.length - 1; i >= 0; i--) {     // topmost first
    const b = bubbles[i];
    if (b.path && ctx.isPointInPath(b.path, e.clientX * DPR, e.clientY * DPR)) { pop(b); return; }
  }
});
addEventListener('keydown', e => {
  if (e.code === 'Space') { pouring = !pouring; e.preventDefault(); }
  if (e.key === 'b' || e.key === 'B') { bgMode = (bgMode + 1) % BACKGROUNDS.length; atlas.length = 0; }
  if (e.key === 'r' || e.key === 'R') { bubbles.length = 0; bits.length = 0; popped = 0; spawnTimer = 0; }
});

let last = performance.now();
(function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
